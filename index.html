<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pluie à Paris</title>
<meta name="description" content="Un petit nuage annonce la pluie à Paris sur les prochaines 24 h, d'après le modèle AROME de Météo-France.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pluie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Une planche de manga : grande case avec le nuage et sa bulle, puis deux cases (frise 24 h, épisodes). */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --ink: #141414;
  --muted: #5e5e5e;
  --tone: rgba(20, 20, 20, 0.16);     /* trames et lignes de vitesse */
  --accent: #2f6bff;                   /* seule couleur d'accent : l'eau */
  --font-display: "Dela Gothic One", "Arial Black", system-ui, sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --border: 3px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --panel: #18191c; --ink: #f2f2f2; --muted: #a3a3a3;
    --tone: rgba(255, 255, 255, 0.13); --accent: #6f9bff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1012; --panel: #18191c; --ink: #f2f2f2; --muted: #a3a3a3;
  --tone: rgba(255, 255, 255, 0.13); --accent: #6f9bff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 1rem/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
main {
  max-width: 30rem;
  margin: 0 auto;
  padding: 1rem 1rem 2.5rem;
  display: grid;
  gap: 0.75rem;   /* gouttière entre les cases */
}

/* ---------- Cases ---------- */
.panel {
  position: relative;
  background: var(--panel);
  border: var(--border) solid var(--ink);
  border-radius: 6px;
  padding: 1rem;
  min-width: 0;
}
.caption {
  display: inline-block;
  background: var(--ink);
  color: var(--panel);
  font: 400 0.8125rem/1 var(--font-display);
  letter-spacing: 0.04em;
  padding: 0.45rem 0.6rem 0.4rem;
  margin: calc(-1rem - var(--border)) 0 0 calc(-1rem - var(--border));
  border-radius: 6px 0 6px 0;
}

/* ---------- Grande case : le nuage ---------- */
.hero { padding: 0; overflow: hidden; display: grid; }
.hero .caption { margin: 0; justify-self: start; position: relative; z-index: 2; }

.bubble {
  position: relative;
  z-index: 2;
  margin: 0.75rem 1rem 0;
  background: var(--panel);
  border: var(--border) solid var(--ink);
  border-radius: 26px;
  padding: 0.9rem 1.1rem 1rem;
  display: grid;
  gap: 0.3rem;
}
/* queue de la bulle, vers le nuage */
.bubble::before, .bubble::after {
  content: "";
  position: absolute;
  left: 38%;
  border-style: solid;
}
.bubble::before { bottom: -20px; border-width: 20px 14px 0 0; border-color: var(--ink) transparent transparent; }
.bubble::after  { bottom: -14px; left: calc(38% + 3.5px); border-width: 15px 9px 0 0; border-color: var(--panel) transparent transparent; }
.bubble h1 {
  margin: 0;
  font: 400 clamp(1.9rem, 9vw, 2.5rem)/1.05 var(--font-display);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.bubble h1 em { font-style: normal; color: var(--accent); }
.bubble p { margin: 0; font-weight: 700; color: var(--muted); text-wrap: pretty; }

.stage {
  position: relative;
  height: 15rem;
  margin-top: -0.5rem;
  display: grid;
  place-items: end center;
}
/* trame de points (temps sec) */
.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(var(--tone) 1.3px, transparent 1.6px);
  background-size: 7px 7px;
  -webkit-mask-image: linear-gradient(to top, #000, transparent 85%);
  mask-image: linear-gradient(to top, #000, transparent 85%);
}
/* lignes de vitesse (pluie proche ou en cours) */
.hero[data-mood="soon"] .stage::before,
.hero[data-mood="rain"] .stage::before {
  background-image: repeating-conic-gradient(from 0deg at 50% 62%, var(--tone) 0deg 1.4deg, transparent 1.4deg 7deg);
  background-size: auto;
  -webkit-mask-image: radial-gradient(circle at 50% 62%, transparent 30%, #000 70%);
  mask-image: radial-gradient(circle at 50% 62%, transparent 30%, #000 70%);
}
.hero[data-mood="rain"] .stage::before { --tone: rgba(20, 20, 20, 0.28); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero[data-mood="rain"] .stage::before { --tone: rgba(255, 255, 255, 0.2); } }
:root[data-theme="dark"] .hero[data-mood="rain"] .stage::before { --tone: rgba(255, 255, 255, 0.2); }

#nimbo { position: relative; width: min(16rem, 78%); }
#nimbo svg { display: block; width: 100%; height: auto; overflow: visible; }

.sfx {
  position: absolute;
  right: 0.9rem;
  top: 1.6rem;
  writing-mode: vertical-rl;
  font: 400 1.75rem/1 var(--font-display);
  letter-spacing: 0.05em;
  color: var(--ink);
  -webkit-text-stroke: 5px var(--panel);
  paint-order: stroke fill;
  transform: rotate(8deg);
}
.sfx.left { right: auto; left: 0.9rem; top: 2.2rem; transform: rotate(-8deg); }

.facts {
  position: relative;
  z-index: 2;
  margin: 0;
  padding: 0.75rem 1rem 1rem;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  border-top: var(--border) solid var(--ink);
  background: var(--panel);
}
.facts li {
  font-size: 0.8125rem;
  font-weight: 800;
  padding: 0.25rem 0.7rem;
  border: 2px solid var(--ink);
  border-radius: 999px;
}
.facts:empty { display: none; }

/* Animations du personnage */
@media (prefers-reduced-motion: no-preference) {
  #nimbo .body { animation: float 3.2s ease-in-out infinite; transform-origin: 50% 80%; }
  .hero[data-mood="rain"] #nimbo .body { animation-duration: 4.5s; }
  .hero[data-mood="soon"] #nimbo .body { animation: shiver 0.5s ease-in-out infinite; }
  #nimbo .drop { animation: fall 1.1s cubic-bezier(.5,0,1,1) infinite; }
  #nimbo .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #nimbo .z { animation: zz 2.4s ease-in-out infinite; }
  #nimbo .snot { animation: snot 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  #nimbo .wave { animation: wave 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  .sfx { animation: pop 0.45s cubic-bezier(.3,1.6,.5,1) both; }
}
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes shiver { 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
@keyframes fall { from { transform: translateY(-6px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(26px); opacity: 0; } }
@keyframes twinkle { 50% { transform: scale(0.55) rotate(20deg); } }
@keyframes zz { 0%, 100% { opacity: 0.25; transform: translateY(4px); } 50% { opacity: 1; transform: translateY(-3px); } }
@keyframes snot { 50% { transform: scale(1.45); } }
@keyframes wave { 50% { transform: rotate(-14deg); } }
@keyframes pop { from { transform: scale(0.4) rotate(0deg); opacity: 0; } }

/* ---------- Case frise ---------- */
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.75rem; }
.panel-head span:not(.caption) { font-size: 0.8125rem; font-weight: 700; color: var(--muted); }
#chart { width: 100%; display: block; overflow: visible; }
#chart text { font-family: var(--font-body); font-weight: 700; font-size: 11px; fill: var(--muted); }
#chart .now-label { fill: var(--ink); font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; margin-top: 0.75rem; font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend i { width: 0.625rem; height: 0.875rem; background: var(--ink); display: inline-block; border-radius: 2px; }
.legend i.p {
  width: 1.4rem; height: 0.6rem; border: 1.5px solid var(--ink); border-radius: 999px;
  background-image: radial-gradient(var(--ink) 1px, transparent 1.3px); background-size: 4px 4px;
}

/* ---------- Case épisodes ---------- */
.episodes ol { list-style: none; margin: 0; padding: 0; display: grid; }
.episode {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.2rem 1rem;
  padding: 0.8rem 0;
}
.episode + .episode { border-top: 2px dashed var(--tone); }
.episode .range { font: 400 1.125rem/1.2 var(--font-display); }
.episode .range small { font: 800 0.6875rem var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 0.35rem; }
.episode .mm { font: 400 1.125rem/1.2 var(--font-display); text-align: right; }
.episode .detail { font-size: 0.875rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.episode .peak { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-align: right; }
.drops { display: inline-flex; gap: 2px; }
.drops svg { width: 10px; height: 13px; }
.empty { margin: 0; font-weight: 700; color: var(--muted); }

/* ---------- Pied ---------- */
footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.25rem 0.125rem 0;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--muted);
}
footer p { margin: 0; }
footer a { color: inherit; }
button {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font: 800 0.8125rem var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  border-radius: 999px;
  padding: 0.5rem 0.95rem;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
}
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button[disabled] { opacity: 0.55; cursor: default; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app">
  <section class="panel hero" id="hero" data-mood="day" aria-live="polite">
    <span class="caption" id="caption">PARIS</span>
    <div class="bubble">
      <h1 id="headline">Je regarde le ciel…</h1>
      <p id="line">Chargement des prévisions AROME.</p>
    </div>
    <div class="stage">
      <div id="nimbo" role="img" aria-label="Petit nuage"></div>
      <div class="sfx" id="sfx" aria-hidden="true"></div>
    </div>
    <ul class="facts" id="facts"></ul>
  </section>

  <section class="panel" aria-label="Pluie sur 24 heures">
    <div class="panel-head">
      <span class="caption">PROCHAINES 24 H</span>
      <span id="total"></span>
    </div>
    <svg id="chart" role="img" aria-label="Intensité de pluie par quart d'heure"></svg>
    <div class="legend">
      <span><i></i>Pluie au quart d'heure</span>
      <span><i class="p"></i>Probabilité par heure</span>
    </div>
  </section>

  <section class="panel episodes">
    <div class="panel-head">
      <span class="caption">ÉPISODES DE PLUIE</span>
      <span id="count"></span>
    </div>
    <ol id="episodes"></ol>
    <p class="empty" id="no-episodes" hidden>Aucun sur les prochaines 24 heures.</p>
  </section>

  <footer>
    <p>Modèle AROME · <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><br><span id="updated"></span></p>
    <button type="button" id="refresh">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      Actualiser
    </button>
  </footer>
</main>

<script>
const LAT = 48.8566, LON = 2.3522;
const AROME = "meteofrance_arome_france_hd";
const SLOTS = 96; // 24 h en quarts d'heure
const SOON = 180; // en minutes : en dessous, le nuage s'inquiète
const DEMO = location.hash.slice(1); // #demo, #pluie, #bientot, #nuit, #soleil

const $ = (id) => document.getElementById(id);
let data = null, loadedAt = 0;

/* ---------- Données ---------- */

function apiUrl(params) {
  const q = new URLSearchParams({ latitude: LAT, longitude: LON, timezone: "Europe/Paris", forecast_days: 2, ...params });
  return "https://api.open-meteo.com/v1/forecast?" + q;
}

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Heure de Paris, quel que soit le fuseau de l'appareil
function parisNow() {
  const p = Object.fromEntries(
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23",
    }).formatToParts(new Date()).map((x) => [x.type, x.value])
  );
  const now = { date: `${p.year}-${p.month}-${p.day}`, h: +p.hour, m: +p.minute };
  if (DEMO === "nuit") now.h = 23;
  if (DEMO === "soleil" || DEMO === "bientot") now.h = 14;
  return now;
}

const pad = (n) => String(n).padStart(2, "0");

function addMinutes(t, minutes) {
  const d = new Date(t + ":00Z");
  d.setUTCMinutes(d.getUTCMinutes() + minutes);
  return d.toISOString().slice(0, 16);
}

async function fetchForecast() {
  if (DEMO) return demoForecast();
  const [q, p] = await Promise.all([
    getJson(apiUrl({ minutely_15: "precipitation", models: AROME })),
    getJson(apiUrl({ hourly: "precipitation_probability", models: "best_match" })),
  ]);
  const proba = {};
  p.hourly.time.forEach((t, i) => (proba[t] = p.hourly.precipitation_probability[i]));
  return { times: q.minutely_15.time, mm: q.minutely_15.precipitation.map((x) => x || 0), proba };
}

// Données fictives, signalées « EXEMPLE » à l'écran
function demoForecast() {
  const now = parisNow();
  const start = `${now.date}T00:00`;
  const times = Array.from({ length: 192 }, (_, i) => addMinutes(start, i * 15));
  const mm = times.map(() => 0);
  const i0 = now.h * 4 + Math.floor(now.m / 15);
  const plans = {
    demo:   [[0, [0.05, 0.1, 0.1, 0.05]], [22, [0.1, 0.3, 0.6, 1.2, 1.9, 1.4, 0.9, 0.5, 0.3, 0.1]], [44, [0.05, 0.1, 0.15, 0.1, 0.05]]],
    pluie:  [[0, [0.6, 0.9, 1.4, 1.1, 0.7, 0.4, 0.2]], [30, [0.1, 0.2, 0.1]]],
    bientot:[[5, [0.1, 0.25, 0.4, 0.3, 0.15, 0.05]]],
    nuit: [], soleil: [],
  }[DEMO] || [];
  plans.forEach(([off, vals]) => vals.forEach((v, k) => (mm[i0 + off + k] = v)));
  const proba = {};
  times.filter((t) => t.endsWith(":00")).forEach((t) => {
    const i = times.indexOf(t);
    const wet = mm.slice(Math.max(0, i - 4), i + 8).some((v) => v > 0);
    proba[t] = wet ? 60 + ((i * 7) % 35) : (i * 3) % 15;
  });
  return { times, mm, proba };
}

/* ---------- Analyse ---------- */

function intensity(mmh) {
  if (mmh < 0.5) return { label: "Bruine", level: 0 };
  if (mmh < 2) return { label: "Faible", level: 1 };
  if (mmh < 5) return { label: "Modérée", level: 2 };
  if (mmh < 10) return { label: "Forte", level: 3 };
  return { label: "Très forte", level: 4 };
}

function analyse({ times, mm, proba }) {
  const now = parisNow();
  const key = `${now.date}T${pad(now.h)}:${pad(Math.floor(now.m / 15) * 15)}`;
  let first = times.findIndex((t) => t >= key);
  if (first < 0) first = times.length;
  const window = [];
  for (let i = first; i < Math.min(first + SLOTS, times.length); i++) {
    window.push({ t: times[i], mmh: mm[i] * 4, mm: mm[i] });
  }

  const episodes = [];
  window.forEach((s, i) => {
    if (s.mm <= 0) return;
    const last = episodes[episodes.length - 1];
    if (last && last.endIdx === i - 1) {
      last.endIdx = i; last.mm += s.mm; last.peak = Math.max(last.peak, s.mmh);
    } else {
      episodes.push({ startIdx: i, endIdx: i, mm: s.mm, peak: s.mmh });
    }
  });
  episodes.forEach((e) => {
    e.start = window[e.startIdx].t;
    e.end = addMinutes(window[e.endIdx].t, 15);
    e.minutes = (e.endIdx - e.startIdx + 1) * 15;
    e.mean = e.mm / (e.minutes / 60);
    e.kind = intensity(e.mean);
    e.ongoing = e.startIdx === 0;
    e.inMinutes = e.startIdx * 15 - (now.m % 15);
    const hours = new Set(window.slice(e.startIdx, e.endIdx + 1).map((s) => s.t.slice(0, 13) + ":00"));
    const ps = [...hours].map((h) => proba[h]).filter((x) => x != null);
    e.proba = ps.length ? Math.max(...ps) : null;
  });
  return { now, window, episodes, proba };
}

/* ---------- Mise en forme ---------- */

const num = (x) => x.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const hm = (t) => `${+t.slice(11, 13)}h${t.slice(14, 16) === "00" ? "" : t.slice(14, 16)}`;
const dayWord = (t, now) => (t.slice(0, 10) === now.date ? "" : "demain ");
const duration = (min) => (min < 60 ? `${min} min` : `${Math.floor(min / 60)} h${min % 60 ? " " + pad(min % 60) : ""}`);
const isNight = (h) => h >= 22 || h < 7;
const lower = (s) => s.toLowerCase();

/* ---------- Le petit nuage (SVG) ---------- */

const INK = "#141414";
const CLOUD = [[70, 112, 34], [108, 84, 46], [152, 92, 38], [180, 120, 26], [96, 136, 30], [140, 138, 30], [50, 132, 22]];
const circles = (attrs) => CLOUD.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" ${attrs}/>`).join("");
const sparkle = (x, y, s, cls = "twinkle") =>
  `<path class="${cls}" transform="translate(${x} ${y}) scale(${s})" d="M0-10Q2-2 10 0Q2 2 0 10Q-2 2-10 0Q-2-2 0-10z" fill="#fff" stroke="${INK}" stroke-width="${2.5 / s}" stroke-linejoin="round"/>`;
const blush = (x, y) =>
  `<ellipse cx="${x}" cy="${y}" rx="10" ry="5.5" fill="#ff9fb3" opacity=".85"/>` +
  [-5, 0, 5].map((d) => `<path d="M${x + d + 1.5} ${y - 3.5}l-3 7" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`).join("");
const eyesOpen = () => [98, 136].map((x) =>
  `<ellipse cx="${x}" cy="110" rx="8.5" ry="12" fill="${INK}"/><circle cx="${x - 3}" cy="104.5" r="3.8" fill="#fff"/><circle cx="${x + 3}" cy="115" r="1.7" fill="#fff"/>`).join("");

function nimbo(mood, level = 1) {
  const fill = { day: "#ffffff", night: "#ffffff", soon: "#dfe3e8", rain: "#4a505b" }[mood];
  let back = "", face = "", front = "";

  if (mood === "day") {
    back = `<g transform="translate(58 58)">${[...Array(8)].map((_, i) => `<path d="M0-33V-43" transform="rotate(${i * 45})" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`).join("")}
      <circle r="25" fill="#ffd84d" stroke="${INK}" stroke-width="4"/></g>`;
    face = eyesOpen() + blush(78, 128) + blush(156, 128) +
      `<path d="M106 125q11 15 22 0z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><path d="M111 131q6 4 12 0q-6-4-12 0z" fill="#ff7f98"/>`;
    front = `<g class="wave"><path d="M196 116q14-8 18-28" stroke="${INK}" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M196 116q14-8 18-28" stroke="${fill}" stroke-width="7" stroke-linecap="round" fill="none"/></g>` +
      sparkle(222, 54, 1) + sparkle(22, 92, 0.7);
  }
  if (mood === "night") {
    back = `<path d="M44 8a26 26 0 1 0 22 44a20 20 0 1 1-22-44z" fill="#ffe58a" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>` +
      sparkle(82, 22, 0.55) + sparkle(228, 100, 0.5);
    face = [98, 136].map((x) => `<path d="M${x - 9} 110q9 8 18 0" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`).join("") +
      blush(78, 126) + blush(156, 126) +
      `<ellipse cx="117" cy="130" rx="4" ry="3" fill="${INK}"/>` +
      `<g class="snot"><circle cx="160" cy="112" r="9" fill="rgba(160,205,255,.45)" stroke="#4b8fd6" stroke-width="2.2"/><circle cx="157" cy="109" r="2.2" fill="#fff"/></g>`;
    front = ["z", "z", "Z"].map((z, i) =>
      `<text class="z" x="${196 + i * 12}" y="${70 - i * 16}" font-family="Dela Gothic One, Arial Black, sans-serif" font-size="${14 + i * 5}" fill="${INK}" stroke="#fff" stroke-width="4" paint-order="stroke" style="animation-delay:${i * 0.4}s">${z}</text>`).join("");
  }
  if (mood === "soon") {
    face = eyesOpen() +
      `<path d="M87 95l14-6M147 95l-14-6" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>` +
      `<path d="M105 131q3-5 6 0t6 0t6 0t6 0" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="M176 74q-9 13 0 18q9-5 0-18z" fill="#cfe6ff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
    front = `<text x="206" y="62" font-family="Dela Gothic One, Arial Black, sans-serif" font-size="52" fill="${INK}" stroke="#fff" stroke-width="6" paint-order="stroke" transform="rotate(12 214 44)">!</text>` +
      [0, 1, 2].map((i) => `<path d="M${34 + i * 9} ${70 - i * 3}l-6-12" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`).join("");
  }
  if (mood === "rain") {
    face = `<path d="M98 66v14M108 64v16M118 64v16M128 66v14" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>` +
      [98, 136].map((x) => `<path d="M${x - 10} 108a10 11 0 0 0 20 0z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="${x}" cy="113" r="4.2" fill="${INK}"/><path d="M${x - 12} 108h24" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`).join("") +
      `<path d="M106 133q11-9 22 0" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>` +
      `<path d="M150 118q-5 8 0 11q5-3 0-11z" fill="#cfe6ff" stroke="${INK}" stroke-width="2.2"/>`;
    const n = [3, 4, 6, 8, 10][level];
    front = [...Array(n)].map((_, i) => {
      const x = 52 + (i * 137 / Math.max(1, n - 1));
      const y = 176 + (i % 2) * 10;
      return `<path class="drop" style="animation-delay:${((i * 0.37) % 1.1).toFixed(2)}s" d="M${x} ${y}q-6 9 0 13q6-4 0-13z" fill="#5c8dff" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    }).join("");
  }

  return `<svg viewBox="0 0 240 215" xmlns="http://www.w3.org/2000/svg">
    ${back}
    <g class="body">
      <g fill="${INK}" stroke="${INK}" stroke-width="10">${circles("")}</g>
      <g fill="${fill}">${circles("")}</g>
      <path d="M78 76q10-14 26-12" stroke="#fff" stroke-opacity="${mood === "rain" ? 0.3 : 0.9}" stroke-width="5" fill="none" stroke-linecap="round"/>
      ${face}
    </g>
    ${front}
  </svg>`;
}

/* ---------- Rendu ---------- */

function render() {
  if (!data) return;
  const a = analyse(data);
  const { now, window, episodes } = a;
  const next = episodes[0];
  const night = isNight(now.h);

  $("caption").textContent = DEMO ? "PARIS · EXEMPLE" : `PARIS · ${now.h}H${pad(now.m)}`;

  let mood, title, line, sfx = "", sfxLeft = false;
  const end = window.length ? addMinutes(window[window.length - 1].t, 15) : null;
  if (!next) {
    mood = night ? "night" : "day";
    title = "Pas de pluie !";
    line = night
      ? `Nuit tranquille, rien de prévu d'ici ${end ? dayWord(end, now) + hm(end) : "demain"}. Je dors…`
      : `Rien de prévu d'ici ${end ? dayWord(end, now) + hm(end) : "demain"}. Laisse le parapluie à la maison.`;
    sfx = night ? "スヤスヤ" : "キラッ";
  } else if (next.ongoing) {
    mood = "rain";
    title = next.kind.level === 0 ? "Il bruine…" : "Il pleut !";
    line = `Pluie ${lower(next.kind.label)} jusqu'à ${dayWord(next.end, now)}${hm(next.end)}. ${next.kind.level >= 2 ? "Prends vraiment un parapluie." : "Une capuche suffira."}`;
    sfx = next.kind.level <= 1 ? "ポツポツ" : "ザーザー";
  } else if (next.inMinutes <= SOON) {
    mood = "soon";
    title = `Pluie ${dayWord(next.start, now)}à ${hm(next.start)} !`;
    const dans = next.inMinutes < 60 ? `${next.inMinutes} min` : duration(Math.round(next.inMinutes / 5) * 5);
    line = `Dans ${dans}. Pluie ${lower(next.kind.label)} pendant ${duration(next.minutes)}, prévois un parapluie.`;
    sfx = "ドキッ"; sfxLeft = true;
  } else {
    mood = night ? "night" : "day";
    title = `Sec jusqu'à ${dayWord(next.start, now)}${hm(next.start)}`;
    line = `Ensuite, pluie ${lower(next.kind.label)} pendant ${duration(next.minutes)}. Tu as le temps.`;
    sfx = night ? "スヤスヤ" : "キラッ";
  }

  const hero = $("hero");
  if (hero.dataset.mood !== mood || $("nimbo").dataset.level !== String(next?.kind.level)) {
    $("nimbo").innerHTML = nimbo(mood, next ? next.kind.level : 0);
    $("nimbo").dataset.level = String(next?.kind.level);
  }
  hero.dataset.mood = mood;
  $("nimbo").setAttribute("aria-label", { day: "Petit nuage blanc souriant", night: "Petit nuage qui dort", soon: "Petit nuage inquiet", rain: "Petit nuage noir qui pleut" }[mood]);
  $("headline").textContent = title;
  $("line").textContent = line;
  const s = $("sfx");
  if (s.textContent !== sfx) { s.textContent = sfx; s.classList.toggle("left", sfxLeft); s.style.animation = "none"; s.offsetWidth; s.style.animation = ""; }

  const facts = next ? [next.kind.label, duration(next.minutes), `${num(next.mm)} mm`, next.proba != null ? `${next.proba} %` : null] : [];
  $("facts").replaceChildren(...facts.filter(Boolean).map((t) => Object.assign(document.createElement("li"), { textContent: t })));

  // Frise
  const total = window.reduce((sum, x) => sum + x.mm, 0);
  $("total").textContent = total > 0 ? `${num(total)} mm au total` : "Rien à l'horizon";
  drawChart(a);

  // Épisodes
  $("count").textContent = episodes.length ? `${episodes.length}` : "";
  const dropIcon = (on) => `<svg viewBox="0 0 10 13"><path d="M5 1Q.8 6.5 1.2 8.6a3.8 3.8 0 0 0 7.6 0Q9.2 6.5 5 1z" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.4"/></svg>`;
  $("episodes").replaceChildren(...episodes.map((e) => {
    const li = document.createElement("li");
    li.className = "episode";
    const sameDay = dayWord(e.start, now) === dayWord(e.end, now);
    li.innerHTML = `
      <div class="range">${dayWord(e.start, now) ? "<small>Demain</small>" : ""}${hm(e.start)} – ${sameDay ? "" : "<small>demain</small>"}${hm(e.end)}</div>
      <div class="mm">${num(e.mm)} mm</div>
      <div class="detail"><span class="drops" title="${e.kind.label}">${[0, 1, 2, 3, 4].map((i) => dropIcon(i <= e.kind.level)).join("")}</span>${e.kind.label} · ${duration(e.minutes)}${e.proba != null ? ` · ${e.proba} %` : ""}</div>
      <div class="peak">pic ${num(e.peak)} mm/h</div>`;
    return li;
  }));
  $("no-episodes").hidden = episodes.length > 0;
}

/* ---------- Frise SVG ---------- */

function drawChart({ window, proba, now }) {
  const svg = $("chart");
  const W = svg.clientWidth || 320;
  const top = 18, barsH = 104, gap = 10, probH = 10;
  const probY = top + barsH + gap, axisY = probY + probH + 18, H = axisY + 4;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  const step = W / SLOTS;
  const max = Math.max(4, ...window.map((s) => s.mmh));
  const y = (v) => top + barsH - (v / max) * barsH;
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--ink").trim();
  const tone = css.getPropertyValue("--tone").trim();

  // Trames de points : plus la probabilité est forte, plus les points sont gros
  const patterns = [0.7, 1.2, 1.7, 2.3].map((r, k) =>
    `<pattern id="tone${k}" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="${r}" fill="${ink}"/></pattern>`).join("");
  const parts = [`<defs>${patterns}</defs>`];

  [[2, "2 mm/h"], [5, "5 mm/h"], [10, "10 mm/h"]].forEach(([v, label]) => {
    if (v > max) return;
    parts.push(`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${tone}" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`);
    parts.push(`<text x="${W}" y="${y(v) - 5}" text-anchor="end">${label}</text>`);
  });
  parts.push(`<line x1="0" x2="${W}" y1="${top + barsH}" y2="${top + barsH}" stroke="${ink}" stroke-width="2"/>`);

  window.forEach((s, i) => {
    if (i === 0 || s.t.slice(11, 16) !== "00:00") return;
    const x = i * step;
    parts.push(`<line x1="${x}" x2="${x}" y1="${top - 8}" y2="${top + barsH}" stroke="${tone}" stroke-width="2"/>`);
    if (x < W - 50) parts.push(`<text x="${x + 5}" y="${top - 1}">demain</text>`);
  });

  const bw = Math.max(1.5, step - 1.2);
  window.forEach((s, i) => {
    if (s.mmh <= 0) return;
    const h = Math.max(3, top + barsH - y(s.mmh));
    parts.push(`<rect x="${i * step + (step - bw) / 2}" y="${top + barsH - h}" width="${bw}" height="${h}" rx="1" fill="${ink}"/>`);
  });

  let i = 0;
  while (i < window.length) {
    const hourKey = window[i].t.slice(0, 13) + ":00";
    let j = i + 1;
    while (j < window.length && window[j].t.slice(0, 13) === window[i].t.slice(0, 13)) j++;
    const p = proba[hourKey] ?? 0;
    const x = i * step + 1, w = Math.max(1, (j - i) * step - 2);
    const fill = p >= 10 ? `url(#tone${Math.min(3, Math.floor(p / 25))})` : "none";
    parts.push(`<rect x="${x}" y="${probY}" width="${w}" height="${probH}" rx="${probH / 2}" fill="${fill}" stroke="${ink}" stroke-width="1.5"><title>${hm(hourKey)} : ${p} %</title></rect>`);
    i = j;
  }

  window.forEach((s, k) => {
    const hh = +s.t.slice(11, 13);
    if (k === 0 || s.t.slice(14, 16) !== "00" || hh % 3 !== 0) return;
    const x = k * step;
    if (x < 84 || x > W - 14) return; // laisse la place à « maintenant »
    parts.push(`<text x="${x}" y="${axisY}" text-anchor="middle">${hh}h</text>`);
  });

  const nx = ((now.m % 15) / 15) * step + 1;
  parts.push(`<line x1="${nx}" x2="${nx}" y1="${top - 6}" y2="${probY + probH}" stroke="${ink}" stroke-width="2"/>`);
  parts.push(`<path d="M${nx - 5} ${top - 12}h10l-5 7z" fill="${ink}"/>`);
  parts.push(`<text class="now-label" x="${nx - 1}" y="${axisY}">maintenant</text>`);

  svg.innerHTML = parts.join("");
}

/* ---------- Chargement ---------- */

async function load() {
  const btn = $("refresh");
  btn.disabled = true;
  try {
    data = await fetchForecast();
    loadedAt = Date.now();
    const n = parisNow();
    $("updated").textContent = DEMO ? "Données d'exemple" : `Mis à jour à ${n.h}h${pad(n.m)}`;
    render();
  } catch (err) {
    if (!data) {
      $("hero").dataset.mood = "soon";
      $("nimbo").innerHTML = nimbo("soon");
      $("headline").textContent = "Je ne vois rien…";
      $("line").textContent = `Open-Meteo ne répond pas. Vérifie ta connexion puis touche Actualiser. (${err.message || err})`;
    } else {
      $("updated").textContent = "Échec de la mise à jour, données précédentes affichées";
    }
  } finally {
    btn.disabled = false;
  }
}

$("nimbo").innerHTML = nimbo("day");
$("refresh").addEventListener("click", load);
window.addEventListener("hashchange", () => location.reload());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - loadedAt > 10 * 60 * 1000) load();
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 100); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
setInterval(render, 60 * 1000); // garde « dans X min » à jour
load();
</script>
